version: 2
updates:
  # Docker image dependencies
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend/tests/integration"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "docker"

  # Compose image dependencies (test stack and upload-fault fixture)
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/backend/tests/integration"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The postgres image ships with the Immich release; it moves with the
      # server image, not on its own.
      - dependency-name: "ghcr.io/immich-app/postgres"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
