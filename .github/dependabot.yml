version: 2
updates:
  # Docker image dependencies
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend/tests/integration"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Europe/Vienna"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "python"
        # The images stay on Python 3.14.
        versions: [">= 3.15"]

  # Compose image dependencies (test stack and upload-fault fixture)
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/backend/tests/integration"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Europe/Vienna"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "python"
        # The images stay on Python 3.14.
        versions: [">= 3.15"]
      # The postgres image ships with the Immich release; it moves with the
      # server image, not on its own.
      - dependency-name: "ghcr.io/immich-app/postgres"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Europe/Vienna"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Europe/Vienna"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
