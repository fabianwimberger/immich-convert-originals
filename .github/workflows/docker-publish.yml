name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/docker-publish.yml'
      - 'scripts/source_notices.py'
      - 'backend/**'
      - 'frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Dependabot and fork pull requests run with a read-only token, and
          # writing the cache then fails the build.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.push.outputs.digest }}"

  source-notices:
    name: Attach release source notices
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Generate source notices
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          python3 scripts/source_notices.py "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST" "$GITHUB_REF_NAME" \
            "${GITHUB_REPOSITORY#*/}-$GITHUB_REF_NAME-source-notices.md"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notice="${GITHUB_REPOSITORY#*/}-$GITHUB_REF_NAME-source-notices.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if gh release create "$GITHUB_REF_NAME" "$notice" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""; then
              exit 0
            fi
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets)
          digest=$(jq -r --arg notice "$notice" '.assets[] | select(.name == $notice) | .digest' <<<"$assets")
          if [[ -z "$digest" ]]; then
            gh release upload "$GITHUB_REF_NAME" "$notice"
          elif [[ "$digest" != "sha256:$(sha256sum "$notice" | cut -d ' ' -f 1)" ]]; then
            echo "The existing source notice differs from $notice" >&2
            exit 1
          fi
