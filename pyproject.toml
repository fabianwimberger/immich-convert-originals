[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-convert-originals"
version = "2.4.2"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.22.1",
    "websockets>=17.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "responses>=0.26.3",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "types-requests>=2.33.0.20260906",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --cov=backend/app --cov-report=term --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end tests against real Immich",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true
# SQLAlchemy's async engine bridges sync DBAPI calls through greenlet;
# without this, coverage under CPython 3.13 loses line tracking on
# whatever runs right after each await, undercounting real coverage.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py313"
include = ["backend/app/**/*.py", "backend/tests/**/*.py"]

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 widened its defaults, which this
# codebase has not been migrated to.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "backend"
